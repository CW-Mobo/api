/auth/login:
  post:
    tags:
      - Authentication

    summary: Realizar login

    description: |
      Autentica um usuário utilizando e-mail e senha.

      Após uma autenticação bem-sucedida, a API:
      - define o JWT no cookie HTTP-only `token`;
      - retorna o JWT no corpo da resposta para clientes mobile e SPA.

    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/LoginInput"

    responses:
      "200":
        description: Login realizado com sucesso.
        headers:
          Set-Cookie:
            description: |
              Cookie HTTP-only contendo o JWT de autenticação.
            schema:
              type: string
              example: "token=eyJhbGciOiJIUzI1NiIs...; Path=/; HttpOnly; SameSite=Lax"

        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthResponse"

      "400":
        description: E-mail ou senha não informados.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Error"

      "401":
        description: Credenciais inválidas.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Error"

/auth/register:
  post:
    tags:
      - Authentication

    summary: Registrar novo usuário

    description: |
      Cria um novo usuário e realiza sua autenticação automaticamente.

      Após o cadastro:
      - o JWT é enviado no cookie HTTP-only `token`;
      - o JWT também é retornado no corpo da resposta.

      A imagem do usuário é enviada através de multipart/form-data.

    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            $ref: "#/components/schemas/RegisterInput"

    responses:
      "200":
        description: Usuário cadastrado com sucesso.
        headers:
          Set-Cookie:
            description: |
              Cookie HTTP-only contendo o JWT de autenticação.
            schema:
              type: string
              example: "token=eyJhbGciOiJIUzI1NiIs...; Path=/; HttpOnly; SameSite=Lax"

        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthResponse"

      "400":
        description: Dados inválidos ou usuário já cadastrado.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Error"

/auth/logout:
  get:
    tags:
      - Authentication

    summary: Realizar logout

    description: |
      Encerra a sessão do usuário removendo o cookie HTTP-only `token`.

      Esta rota exige autenticação através do cookie ou do header
      Authorization.

    security:
      - cookieAuth: []
      - bearerAuth: []

    responses:
      "200":
        description: Logout realizado com sucesso.
        headers:
          Set-Cookie:
            description: Cookie `token` removido da sessão.
            schema:
              type: string
              example: "token=; Path=/; Max-Age=0; HttpOnly; SameSite=Lax"

        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true

                message:
                  type: string
                  example: "Logout efetuado com sucesso."

      "401":
        description: Token não fornecido ou não autorizado.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Error"
