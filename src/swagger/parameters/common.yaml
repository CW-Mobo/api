CompanyId:
  name: id
  in: path
  required: true
  description: ID da empresa.
  schema:
    type: string
    pattern: "^[a-fA-F0-9]{24}$"
    example: "665f1a2b3c4d5e6f78901234"

PlantingId:
  name: id
  in: path
  required: true
  description: ID da plantação.
  schema:
    type: string
    pattern: "^[a-fA-F0-9]{24}$"
    example: "665f1a2b3c4d5e6f78901234"

HarvestId:
  name: id
  in: path
  required: true
  description: ID da colheita.
  schema:
    type: string
    pattern: "^[a-fA-F0-9]{24}$"
    example: "665f1a2b3c4d5e6f78901234"

Page:
  name: page
  in: query
  required: false
  description: Número da página. O padrão é 1.
  schema:
    type: integer
    minimum: 1
    default: 1
    example: 1

Limit:
  name: limit
  in: query
  required: false
  description: Quantidade de colheitas por página. O padrão é 10 e o máximo é 20.
  schema:
    type: integer
    minimum: 1
    maximum: 20
    default: 10
    example: 10

SensorId:
  name: id
  in: path
  required: true
  description: ID do sensor.
  schema:
    type: string
    pattern: "^[a-fA-F0-9]{24}$"
    example: "665f1a2b3c4d5e6f78901234"
